# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen generate
name: BharatiDesk
options:
  bundleIdPrefix: in.bharatiinvestigations
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Apple Developer Team ID
targets:
  BharatiDesk:
    type: application
    platform: iOS
    sources:
      - path: BharatiDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.bharatiinvestigations.desk
        PRODUCT_NAME: BharatiDesk
        PRODUCT_MODULE_NAME: BharatiDesk
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: BharatiDesk/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BharatiDesk/Resources/BharatiDesk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  BharatiDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BharatiDeskTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: in.bharatiinvestigations.desk.tests
    dependencies:
      - target: BharatiDesk
schemes:
  BharatiDesk:
    build:
      targets:
        BharatiDesk: all
    test:
      targets: [BharatiDeskTests]
