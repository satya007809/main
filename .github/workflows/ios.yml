name: ios
# 1) On every iOS change: compile the app and run its unit tests on an iPhone simulator (no Apple account needed).
# 2) On manual run ("Run workflow" -> testflight = true): build, sign in the cloud and upload to TestFlight.
#    Needs repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (see docs/NO_MAC_SETUP.md).
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload a new build to TestFlight"
        type: boolean
        default: true

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Compile app and tests (generic simulator, no device needed)
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project BharatiDesk.xcodeproj -scheme BharatiDesk \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | tail -n 120
      - name: Run unit tests on a compatible simulator
        run: |
          set -o pipefail
          # Ask Xcode which simulators work with this scheme (runner images differ).
          DEST=$(xcodebuild -showdestinations -project BharatiDesk.xcodeproj -scheme BharatiDesk 2>/dev/null \
            | grep "platform:iOS Simulator" | grep "name:iPhone" | grep -v placeholder \
            | sed -E 's/.*id:([^,]+),.*/\1/' | head -n1)
          if [ -z "$DEST" ]; then echo "::warning::No iPhone simulator available on this runner; tests skipped (app compiled)"; exit 0; fi
          echo "Using simulator $DEST"
          xcodebuild test-without-building -project BharatiDesk.xcodeproj -scheme BharatiDesk \
            -destination "id=$DEST" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tail -n 80

  testflight:
        description: "Upload a new build to TestFlight"
        type: boolean
        default: true

jobs:
  build-and-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and unit-test on simulator
        run: |
          set -o pipefail
          # Runner images differ in which simulators exist: pick any available iPhone simulator.
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for rt, ds in sorted(devs.items(), reverse=True) if "iOS" in rt
                 for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          if [ -z "$DEST" ]; then
            RT=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1] if r else "")')
            DT=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; t=[x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")]; print(t[-1])')
            DEST=$(xcrun simctl create "CI iPhone" "$DT" "$RT")
          fi
          echo "Using simulator $DEST"
          xcodebuild test -project BharatiDesk.xcodeproj -scheme BharatiDesk \
            -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO | tail -n 80

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build-and-test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v (see docs/NO_MAC_SETUP.md)"; exit 1; }
          done
      - run: brew install xcodegen
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Set team and build number
        run: |
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"${APPLE_TEAM_ID}\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
      - name: Archive (cloud signing)
        run: |
          set -o pipefail
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcodebuild archive -project BharatiDesk.xcodeproj -scheme BharatiDesk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/BharatiDesk.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic | tail -n 60
      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          sed "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/" ci/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/BharatiDesk.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60
      - name: Remove key
        if: always()
        run: rm -rf ~/.appstoreconnect
